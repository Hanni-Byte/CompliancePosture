version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  # Tracks the digest-pinned node/caddy base images (D18: pins stay pinned,
  # Dependabot proposes the bump).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday