name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are SHA-pinned (tags are mutable); the trailing comment
# is the version Dependabot keeps current.
jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run depcruise
      - run: npm run test
      # Schema + checksums + invariants + catalogue + crosswalk ids, offline.
      - run: npm run packs:check:offline
      # smoke becomes a real golden diff with Feature 5.
      - run: npm run smoke

  citation-resolvability:
    # Constitution gate: every citation URL resolves live (EUR-Lex via Cellar
    # anchor verification, D25). One automatic retry absorbs upstream blips.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run packs:check || (sleep 30 && npm run packs:check)

  packs:
    # The pipeline side of the contract (D11): ruff + pytest, pydantic
    # validation of the committed packs, and a fresh build that must be
    # byte-identical to what is committed. Raw sources are digest-verified
    # and cached between runs so upstream availability is not a per-PR risk.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/raw
          key: pack-raw-${{ hashFiles('tools/packs/packs/sources/*.py') }}
      - name: Build pipeline image
        run: docker build -f docker/Dockerfile.packs -t complianceposture-packs:ci .
      - name: Lint + unit tests
        run: docker run --rm --entrypoint sh complianceposture-packs:ci -c "ruff check packs tests && pytest -q"
      - name: Validate committed packs (pydantic + checksums + catalogue)
        run: docker run --rm -v "$PWD/packs:/out:ro" complianceposture-packs:ci validate /out
      - name: Reproducibility — fresh build equals committed packs (both ways)
        run: |
          mkdir -p .cache/raw
          docker run --rm -v "$PWD/packs:/out:ro" -v "$PWD/.cache/raw:/raw" complianceposture-packs:ci check /out --raw /raw

  image:
    # Built exactly once per run; downstream jobs load this artifact.
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build prod image
        run: docker build -f docker/Dockerfile -t complianceposture:ci .
      - name: Publish image digest (trust artifact, D18)
        run: |
          docker image inspect complianceposture:ci --format 'image id: {{.Id}}'
      - run: docker save complianceposture:ci | gzip > image.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prod-image
          path: image.tar.gz
          retention-days: 1

  docker:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: prod-image
      - run: docker load < image.tar.gz
      - name: Image serves index.html, packs, and headers; healthcheck passes
        run: |
          docker run -d --rm -p 8080:80 -e SITE_ADDRESS=":80" --name cp complianceposture:ci
          for i in $(seq 1 15); do curl -fsSo /dev/null http://localhost:8080/ && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -qi complianceposture
          curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy"
          curl -fsSI http://localhost:8080/packs/index.json | grep -qi "application/json"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/packs/nope/manifest.json)" = "404"
          for i in $(seq 1 20); do [ "$(docker inspect --format '{{.State.Health.Status}}' cp)" = "healthy" ] && break; sleep 2; done
          test "$(docker inspect --format '{{.State.Health.Status}}' cp)" = "healthy"
          test "$(docker exec cp id -u)" != "0"
          docker stop cp

  e2e:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: prod-image
      - run: docker load < image.tar.gz
      - name: Playwright suite against the built image (same definition as `make e2e`)
        run: docker compose --profile e2e up --no-build --abort-on-container-exit --exit-code-from e2e
      - if: always()
        run: docker compose --profile e2e down

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check DCO sign-off on all commits
        run: |
          status=0
          # --no-merges: skips GitHub's synthetic PR merge commit (and any
          # real merge commits) — a merge can never carry a sign-off.
          for sha in $(git rev-list --no-merges origin/${{ github.base_ref }}..HEAD); do
            # Bot commits (Dependabot etc.) are exempt: DCO certifies human
            # copyright provenance; automated version bumps have none.
            author=$(git log -1 --format=%ae "$sha")
            case "$author" in *"[bot]@users.noreply.github.com") continue ;; esac
            if ! git log -1 --format=%B "$sha" | grep -q "^Signed-off-by: "; then
              echo "missing Signed-off-by: $sha"
              status=1
            fi
          done
          exit $status
