name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run depcruise
      - run: npm run test
      # Gateway contract suite runs as part of `npm run test` once adapters
      # exist (Feature 1); smoke becomes a real golden diff with Feature 5.
      - run: npm run smoke

  citation-resolvability:
    # Real checks arrive with Feature 2 (packs). Until then, validate that any
    # committed pack at least parses; zero packs is a pass, not a skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify pack manifests parse
        run: |
          shopt -s nullglob
          status=0
          for m in packs/*/manifest.json; do
            echo "validating $m"
            python3 -m json.tool "$m" > /dev/null || status=1
          done
          exit $status

  docker:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v7
      - name: Build prod image
        run: docker build -f docker/Dockerfile -t complianceposture:ci .
      - name: Image serves index.html
        run: |
          docker run -d --rm -p 8080:80 -e SITE_ADDRESS=":80" --name cp complianceposture:ci
          sleep 2
          curl -fsS http://localhost:8080/ | grep -qi complianceposture
          curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy"
          docker stop cp
      - name: Publish build digest (trust artifact, D18)
        run: |
          docker image inspect complianceposture:ci --format 'image id: {{.Id}}'

  e2e:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v7
      - name: Build prod image
        run: docker build -f docker/Dockerfile -t complianceposture:e2e .
      - name: Start prod container
        run: |
          docker run -d --rm -p 8081:80 -e SITE_ADDRESS=":80" --name cp complianceposture:e2e
          for i in $(seq 1 15); do curl -fsSo /dev/null http://localhost:8081/ && break; sleep 1; done
      - name: Playwright CSP canary suite
        run: |
          docker run --rm --network host \
            -v "$PWD/app:/work" -v /work/node_modules -w /work \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            sh -c "npm ci --no-audit --no-fund && npx playwright test"
      - name: Stop container
        if: always()
        run: docker stop cp || true

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check DCO sign-off on all commits
        run: |
          status=0
          for sha in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            # Bot commits (Dependabot etc.) are exempt: DCO certifies human
            # copyright provenance; automated version bumps have none.
            author=$(git log -1 --format=%ae "$sha")
            case "$author" in *"[bot]@users.noreply.github.com") continue ;; esac
            if ! git log -1 --format=%B "$sha" | grep -q "^Signed-off-by: "; then
              echo "missing Signed-off-by: $sha"
              status=1
            fi
          done
          exit $status