# docs/SECURITY.md explains why each scanner is here and what was deliberately
# excluded. Scope: SAST (CodeQL), SCA (OSV-Scanner + Dependency Review),
# container (Trivy), DAST (ZAP baseline, passive). Secrets are covered by
# GitHub native secret scanning + push protection (repo settings), not CI.
# Every third-party action, image, and binary is SHA/digest/checksum-pinned.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # weekly: catches new CVEs/rules with no code change

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: SAST / CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: "/language:${{ matrix.language }}"

  osv-scan:
    name: SCA / OSV-Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      OSV_VERSION: v2.6.0
      OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install osv-scanner (pinned release, verified checksum)
        run: |
          curl -sSL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  /usr/local/bin/osv-scanner" | sha256sum -c -
          chmod +x /usr/local/bin/osv-scanner
      - name: Scan lockfiles (fails on known vulnerabilities)
        run: osv-scanner scan --format sarif --output osv.sarif --recursive .
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always()
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  dependency-review:
    name: SCA / Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  container:
    # One build feeds both the image scan and the DAST baseline.
    name: Container / Trivy + ZAP baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build prod image
        run: docker build -f docker/Dockerfile -t complianceposture:scan .
      # Zero-tolerance gate: ANY severity with an available fix blocks the
      # build. ignore-unfixed stays on because a vulnerability with no released
      # fix anywhere is not actionable — it starts gating (and gets picked up
      # by the image's @latest dep bumps) the moment upstream ships a fix.
      - name: Trivy — scan image (gates on any fixable vulnerability)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: complianceposture:scan
          format: sarif
          output: trivy.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Start image for DAST
        run: |
          docker run -d --rm -p 8080:80 -e SITE_ADDRESS=":80" --name cp complianceposture:scan
          for i in $(seq 1 15); do curl -fsSo /dev/null http://localhost:8080/ && break; sleep 1; done
          curl -fsSo /dev/null http://localhost:8080/
      - name: ZAP passive baseline (accepted findings in .zap/rules.tsv)
        run: |
          chmod -R a+w .zap
          docker run --rm --network host -v "$PWD/.zap:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-baseline.py -t http://localhost:8080 -c rules.tsv -w baseline-report.md
      - name: Stop app container
        if: always()
        run: docker stop cp || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: zap-baseline-report
          path: .zap/baseline-report.md
          if-no-files-found: ignore
