name: complianceposture

services:
  dev:
    profiles: ["dev"]
    container_name: cp-vite
    image: node:26-alpine@sha256:aadf416b2cdce311a8811ba3f0608a61b77dbf997500e2eafe781b51f6a0b019
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ../app:/app
      - dev_node_modules:/app/node_modules

  # Optional local model so contributors can develop fully offline (D2).
  ollama:
    profiles: ["dev", "ollama"]
    container_name: cp-ollama
    image: ollama/ollama:latest
    environment:
      OLLAMA_ORIGINS: "http://localhost:5173,http://localhost:8080"
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  packs:
    profiles: ["packs"]
    container_name: cp-packs
    build:
      context: ..
      dockerfile: docker/Dockerfile.packs
    volumes:
      - ../packs:/out

  prod:
    profiles: ["prod"]
    container_name: cp-prod
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      SITE_ADDRESS: ":80"
    ports:
      - "8080:80"

volumes:
  dev_node_modules:
  ollama_models: