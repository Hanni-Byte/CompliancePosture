name: complianceposture

services:
  dev:
    profiles: ["dev"]
    container_name: cp-vite
    image: node:26-alpine@sha256:2d984a15c9b54fd0aeb608b8e0d0d83529eb34d2966db27a1fb4f1edc3d298a3
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ../app:/app
      - ../packs:/packs:ro
      - dev_node_modules:/app/node_modules

  # Optional local model so contributors can develop fully offline (D2).
  ollama:
    profiles: ["dev", "ollama"]
    container_name: cp-ollama
    image: ollama/ollama:0.12.3@sha256:c622a7adec67cf5bd7fe1802b7e26aa583a955a54e91d132889301f50c3e0bd0
    environment:
      # Dev origins; the production hint users get is in app/src/adapters/llm/providers.ts.
      OLLAMA_ORIGINS: "http://localhost:5173,http://localhost:8080,http://localhost:8081"
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  packs:
    profiles: ["packs"]
    container_name: cp-packs
    build:
      context: ..
      dockerfile: docker/Dockerfile.packs
    volumes:
      - ../packs:/out
      - ../tools/packs/raw:/raw

  # Playwright against the real prod image. Locally `make e2e` builds it;
  # CI loads the image built once by the `image` job and runs with --no-build.
  e2e-app:
    profiles: ["e2e"]
    container_name: cp-e2e-app
    image: complianceposture:ci
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      SITE_ADDRESS: ":80"

  e2e:
    profiles: ["e2e"]
    container_name: cp-e2e
    image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    depends_on:
      - e2e-app
    # Share the app container's network so the browser reaches it as
    # http://localhost — a secure context, which Web Crypto (pack
    # verification) requires. http://e2e-app would not be.
    network_mode: "service:e2e-app"
    working_dir: /work
    environment:
      PLAYWRIGHT_BASE_URL: "http://localhost:80"
    volumes:
      - ../app:/work
      - e2e_node_modules:/work/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npx playwright test"

  prod:
    profiles: ["prod"]
    container_name: cp-prod
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      SITE_ADDRESS: ":80"
    ports:
      - "8080:80"

volumes:
  dev_node_modules:
  e2e_node_modules:
  ollama_models:
